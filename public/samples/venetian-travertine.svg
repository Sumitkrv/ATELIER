<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <linearGradient id="plasterBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5EFE6"/>
      <stop offset="50%" stop-color="#E7DDD0"/>
      <stop offset="100%" stop-color="#D5C6B2"/>
    </linearGradient>
    <linearGradient id="archShadow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B9A68E"/>
      <stop offset="35%" stop-color="#DFD3C3"/>
      <stop offset="100%" stop-color="#F2ECE1"/>
    </linearGradient>
    <linearGradient id="innerArch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8B49B"/>
      <stop offset="100%" stop-color="#E8DEC9"/>
    </linearGradient>
    <pattern id="fluting" width="32" height="1200" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="16" height="1200" fill="#DFD3C2" fill-opacity="0.45"/>
      <rect x="16" y="0" width="16" height="1200" fill="#EFE8DC" fill-opacity="0.45"/>
      <line x1="16" y1="0" x2="16" y2="1200" stroke="#B7A389" stroke-width="1" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Travertine & Fluted Plaster Base -->
  <rect width="1600" height="1200" fill="url(#plasterBase)"/>
  <rect width="1600" height="1200" fill="url(#fluting)"/>

  <!-- Three Classical Palazzo Arches -->
  <!-- Left Arch -->
  <g transform="translate(110, 140)">
    <path d="M 0 1060 L 0 210 A 210 210 0 0 1 420 210 L 420 1060 Z" fill="url(#archShadow)" stroke="#9A6F44" stroke-width="2.5" stroke-opacity="0.55"/>
    <path d="M 45 1060 L 45 220 A 165 165 0 0 1 375 220 L 375 1060 Z" fill="url(#innerArch)"/>
    <circle cx="210" cy="220" r="85" fill="none" stroke="#9A6F44" stroke-width="2" stroke-opacity="0.5"/>
  </g>

  <!-- Center Grand Arch -->
  <g transform="translate(560, 80)">
    <path d="M 0 1120 L 0 240 A 240 240 0 0 1 480 240 L 480 1120 Z" fill="url(#archShadow)" stroke="#9A6F44" stroke-width="3" stroke-opacity="0.7"/>
    <path d="M 55 1120 L 55 250 A 185 185 0 0 1 425 250 L 425 1120 Z" fill="url(#innerArch)"/>
    <path d="M 110 1120 L 110 265 A 130 130 0 0 1 370 265 L 370 1120 Z" fill="#F5EFE6" opacity="0.65"/>
    <circle cx="240" cy="240" r="105" fill="#C49A6C" fill-opacity="0.28" stroke="#9A6F44" stroke-width="2"/>
  </g>

  <!-- Right Arch -->
  <g transform="translate(1070, 140)">
    <path d="M 0 1060 L 0 210 A 210 210 0 0 1 420 210 L 420 1060 Z" fill="url(#archShadow)" stroke="#9A6F44" stroke-width="2.5" stroke-opacity="0.55"/>
    <path d="M 45 1060 L 45 220 A 165 165 0 0 1 375 220 L 375 1060 Z" fill="url(#innerArch)"/>
    <circle cx="210" cy="220" r="85" fill="none" stroke="#9A6F44" stroke-width="2" stroke-opacity="0.5"/>
  </g>

  <!-- Horizontal Bronze Dado & Plinth Lines -->
  <line x1="0" y1="960" x2="1600" y2="960" stroke="#9A6F44" stroke-width="3" stroke-opacity="0.5"/>
  <line x1="0" y1="976" x2="1600" y2="976" stroke="#9A6F44" stroke-width="1.5" stroke-opacity="0.35"/>
</svg>

