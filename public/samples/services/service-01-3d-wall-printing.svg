<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="wallBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCF6EF" />
      <stop offset="55%" stop-color="#F3E4D5" />
      <stop offset="100%" stop-color="#E3CEB9" />
    </linearGradient>
    <linearGradient id="archDepth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#681A27" />
      <stop offset="50%" stop-color="#791B2C" />
      <stop offset="100%" stop-color="#32191B" />
    </linearGradient>
    <linearGradient id="innerCorridor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C8A88B" />
      <stop offset="100%" stop-color="#8B6852" />
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D9C3AE" />
      <stop offset="100%" stop-color="#B89B80" />
    </linearGradient>
  </defs>

  <!-- Interior Wall Background -->
  <rect width="1200" height="740" fill="url(#wallBg)" />
  <!-- Architectural Wainscoting & Floor -->
  <line x1="0" y1="740" x2="1200" y2="740" stroke="#C8A88B" stroke-width="3" />
  <rect y="740" width="1200" height="160" fill="url(#floorGrad)" />

  <!-- Subtle Sunlight Cast Across Wall -->
  <polygon points="0,0 520,0 780,740 0,740" fill="#FCF6EF" opacity="0.38" />

  <!-- Direct-to-Wall Printed 3D Perspective Optical Arch Mural -->
  <g transform="translate(230, 80)">
    <!-- Outer Printed Shadow Frame -->
    <rect x="0" y="0" width="740" height="600" rx="6" fill="#32191B" opacity="0.08" />
    <rect x="14" y="14" width="712" height="572" fill="#FCF6EF" stroke="#C8A88B" stroke-width="2" />

    <!-- Perspective Colonnade Lines (3D Optical Depth Printed on Flat Wall) -->
    <polygon points="14,14 140,110 140,490 14,586" fill="#EAD8C7" />
    <polygon points="726,14 600,110 600,490 726,586" fill="#DEC6B0" />
    <polygon points="14,14 726,14 600,110 140,110" fill="#F5E9DC" />
    <polygon points="14,586 726,586 600,490 140,490" fill="#D5B99F" />

    <!-- Central Deep Maroon Architectural Arch Print -->
    <path d="M190,490 L190,230 A180,180 0 0,1 550,230 L550,490 Z" fill="url(#archDepth)" />
    <!-- Nested Inner Perspective Arch -->
    <path d="M245,490 L245,255 A125,125 0 0,1 495,255 L495,490 Z" fill="url(#innerCorridor)" opacity="0.92" />
    <path d="M295,490 L295,285 A75,75 0 0,1 445,285 L445,490 Z" fill="#FCF6EF" opacity="0.9" />

    <!-- Geometric Horizon Sun & Perspective Grid Lines -->
    <circle cx="370" cy="305" r="42" fill="#791B2C" opacity="0.9" />
    <line x1="140" y1="110" x2="600" y2="110" stroke="#681A27" stroke-width="1.5" stroke-opacity="0.35" />
    <line x1="190" y1="490" x2="370" y2="380" stroke="#32191B" stroke-width="1.2" stroke-opacity="0.4" />
    <line x1="550" y1="490" x2="370" y2="380" stroke="#32191B" stroke-width="1.2" stroke-opacity="0.4" />
    <line x1="295" y1="490" x2="370" y2="380" stroke="#681A27" stroke-width="1.2" stroke-opacity="0.4" />
    <line x1="445" y1="490" x2="370" y2="380" stroke="#681A27" stroke-width="1.2" stroke-opacity="0.4" />

    <!-- Fine Editorial Caption Line on Wall -->
    <text x="38" y="562" fill="#681A27" font-family="Georgia, serif" font-size="14" letter-spacing="3">
      01 • DIRECT 3D PERSPECTIVE WALL PRINT • ATELIER WALL STORY
    </text>
  </g>

  <!-- Minimalist Architectural Sofa Silhouette in Foreground for Interior Scale -->
  <g transform="translate(310, 650)">
    <rect x="0" y="35" width="580" height="75" rx="10" fill="#32191B" />
    <rect x="28" y="0" width="255" height="55" rx="8" fill="#4A2528" />
    <rect x="297" y="0" width="255" height="55" rx="8" fill="#4A2528" />
    <rect x="-18" y="20" width="36" height="90" rx="8" fill="#681A27" />
    <rect x="562" y="20" width="36" height="90" rx="8" fill="#681A27" />
  </g>
</svg>

